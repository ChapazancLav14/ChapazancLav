<!--quiz.html-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quiz</title>

  <link rel="icon" type="image/png" href="images/icon.png" />

  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/buttons.css" />
  <link rel="stylesheet" href="css/quiz.css" />
</head>

<body>

  <!-- 🔙 BACK -->
  <button class="back-btn" onclick="goBack()">
    <svg class="back-icon" viewBox="0 0 24 24">
      <path d="M15 18L9 12L15 6"></path>
    </svg>
  </button>

  <!-- 🔢 REAL CSV QUESTION ID -->
  <div id="csv-question-id" class="csv-question-id">ID</div>

  <!-- 🧮 CALCULATOR TOGGLE -->
  <button class="calculator-toggle" onclick="toggleCalculator()">
    <img src="images/calculator.png" alt="Calculator" />
  </button>

  <!-- 🧮 CALCULATOR BLOCK -->
  <div id="calculatorBlock" class="calculator-block hidden-calculator">
    <input id="calcDisplay" class="calc-display" type="text" readonly />

    <div class="calc-grid">
      <button onclick="clearCalc()">C</button>
      <button onclick="deleteCalc()">⌫</button>
      <button onclick="appendCalc('(')">(</button>
      <button onclick="appendCalc(')')">)</button>

      <button onclick="appendCalc('7')">7</button>
      <button onclick="appendCalc('8')">8</button>
      <button onclick="appendCalc('9')">9</button>
      <button onclick="appendCalc('/')">÷</button>

      <button onclick="appendCalc('4')">4</button>
      <button onclick="appendCalc('5')">5</button>
      <button onclick="appendCalc('6')">6</button>
      <button onclick="appendCalc('*')">×</button>

      <button onclick="appendCalc('1')">1</button>
      <button onclick="appendCalc('2')">2</button>
      <button onclick="appendCalc('3')">3</button>
      <button onclick="appendCalc('-')">−</button>

      <button onclick="appendCalc('0')">0</button>
      <button onclick="appendCalc('.')">.</button>
      <button onclick="appendCalc('^')">xʸ</button>
      <button onclick="appendCalc('+')">+</button>

      <button onclick="appendCalc('+/-')">±</button>
      <button onclick="appendCalc('!')">!</button>
      <button class="empty-calc-btn"></button>
      <button class="equals-btn" onclick="calculateCalc()">=</button>
    </div>
  </div>

  <!-- ✅ QUIZ CONTENT -->
  <div id="quiz-layout" class="quiz-layout">

    <!-- LEFT SIDE: QUESTION + ANSWERS -->
    <div class="quiz-left">

      <!-- ✅ QUESTION BOX -->
      <div class="question-box">
        <div id="question-number" class="question-number"></div>
        <div id="question" class="question"></div>
      </div>

      <!-- ✅ ANSWERS -->
      <div id="answers" class="answers"></div>

    </div>

    <!-- RIGHT SIDE: IMAGE -->
    <div id="image-container" class="image-wrapper"></div>

  </div>

  <!-- 🔢 QUESTION NAVIGATION + JUMP TO QUESTION -->
  <div class="nav-jump-panel">
    <div class="question-nav-buttons">
      <button id="prevQuestionBtn" class="question-nav-btn" onclick="previousQuestion()" aria-label="Previous question">←</button>
      <button id="skipQuestionBtn" class="question-nav-btn" onclick="skipQuestion()" aria-label="Skip to next question">→</button>
    </div>

    <div class="jump-container">
      <input id="jumpInput" type="number" placeholder="1 - 125" />
      <button onclick="jumpToQuestion()">Go</button>
      <div id="jumpError" class="jump-error"></div>
    </div>
  </div>

  <!-- ✅ FEEDBACK -->
  <div id="feedback" class="feedback">
    <div id="feedback-title"></div>
    <div id="feedback-text"></div>
    <button onclick="nextQuestion()">Next</button>
  </div>

  <!-- 📊 PROGRESS -->
  <div class="progress-wrapper">
    <div id="progress-text" class="progress-text">1/125</div>
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
  </div>

  <!-- BEST PERCENT HIDDEN HOLDER -->
  <div id="page-best" style="display: none;">0%</div>

  <script type="module" src="js/script.js"></script>

</body>
</html>
