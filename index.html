<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>exam.am Login</title>

  <link rel="icon" type="image/png" href="images/icon.png" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>
  <main class="login-page">
    <header class="top-brand">
      <div class="brand-logo">LiGri</div>
      <div class="brand-line"></div>
      <div class="brand-tagline">We build digital future</div>
    </header>

    <section class="login-content">
      <img class="flower-logo" src="images/login_flower.png" alt="exam.am" />

      <h1 class="main-title">
        <span>exam</span><strong>.am</strong>
      </h1>

      <p class="subtitle">
        Smart assessment platform<br />
        powered by <span>LiGri</span>
      </p>

      <section class="auth-card">
        <div class="input-row">
          <span>✉</span>
          <input type="email" id="email" placeholder="Email" autocomplete="email" />
        </div>

        <div class="input-row">
          <span>▣</span>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" />
          <span class="eye">◉</span>
        </div>

        <button id="mainBtn" class="main-btn">
          <span>Log in</span>
          <b>→</b>
        </button>

        <div class="card-links">
          <button type="button" class="text-btn">Forgot password?</button>
          <span></span>
          <button type="button" id="registerTab" class="text-btn">Create account</button>
        </div>

        <div class="divider">
          <i></i>
          <span>or continue with</span>
          <i></i>
        </div>

        <div class="social-row">
          <button type="button" class="social-btn">
            <span class="google">G</span>
            Google
          </button>

          <button type="button" id="microsoftBtn" class="social-btn">
            <span class="ms">
              <i></i><i></i><i></i><i></i>
            </span>
            Microsoft
          </button>
        </div>

        <button id="resendBtn" class="resend-btn hidden">Resend Verification</button>
        <div id="error"></div>
      </section>
    </section>

    <footer class="bottom-bar">
      <p>© 2024 LiGri LLC. All rights reserved.</p>

      <button class="language-btn">
        🌐 <span>EN</span>⌄
      </button>
    </footer>
  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
